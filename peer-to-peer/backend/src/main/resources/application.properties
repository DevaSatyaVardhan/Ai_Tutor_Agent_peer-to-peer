# Server Configuration
server.port=8080
server.servlet.context-path=/api


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/peer_learning?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# AI Agent Service (FastAPI)
ai.agent.url=http://127.0.0.1:8000

# Logging
logging.level.com.anu=DEBUG
logging.level.org.springframework.web=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# JWT Configuration (Token validity: 24 hours)
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationThatShouldBeAtLeast512BitsForHS512Algorithm
jwt.expiration=86400000

# Admin Credentials
admin.email=admin.peertopeer@gmail.com
admin.password=admin12345