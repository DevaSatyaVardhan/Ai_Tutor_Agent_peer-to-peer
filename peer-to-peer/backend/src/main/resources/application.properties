# Server Configuration
server.port=8080
server.servlet.context-path=/api


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/peer_learning?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# AI Service Configuration
ai.service.url=http://localhost:8000
ai.service.chat.endpoint=/chat
ai.service.upload.endpoint=/upload

# Logging
logging.level.com.anu=DEBUG
logging.level.org.springframework.web=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Security - JWT
security.jwt.access-secret=dev_access_secret_1234567890_abcdefghi
security.jwt.refresh-secret=dev_refresh_secret_1234567890_abcdefghi
security.jwt.access-ttl-minutes=15
security.jwt.refresh-ttl-days=7

# Admin Credentials
admin.email=admin.peertopeer@gmail.com
admin.password=admin12345