<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Peer Learning Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="background-mesh"></div>

    <nav class="navbar">
        <div class="container nav-container">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="brand-text">
                    <h1>Admin Dashboard</h1>
                    <p>Platform Management</p>
                </div>
            </div>
            <div class="nav-actions">
                <span class="user-badge" id="adminUserBadge"></span>
                <button class="btn btn-secondary" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('students')">
                <i class="fas fa-users"></i> Student Management
            </button>
            <button class="tab-btn" onclick="switchTab('videos')">
                <i class="fas fa-video"></i> Video Management
            </button>
        </div>

        <!-- Students Tab -->
        <section class="tab-content active" id="studentsTab">
            <div class="dashboard-header">
                <div>
                    <h3 class="section-title">Registered Students</h3>
                    <p class="section-subtitle">Manage student accounts and monitor activity</p>
                </div>
                <div class="dashboard-actions">
                    <button class="btn btn-secondary" onclick="loadStudents()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            </div>

            <div class="table-card">
                <table class="admin-table" id="studentsTable">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Roll Number</th>
                            <th>Department</th>
                            <th>Email</th>
                            <th>Videos</th>
                            <th>Registered</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="7" class="table-placeholder">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Videos Tab -->
        <section class="tab-content" id="videosTab">
            <div class="dashboard-header">
                <div>
                    <h3 class="section-title">All Videos</h3>
                    <p class="section-subtitle">Manage uploaded videos across the platform</p>
                </div>
                <div class="dashboard-actions">
                    <button class="btn btn-secondary" onclick="loadVideos()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            </div>

            <div class="videos-grid" id="videosGrid">
                <p class="loading-text">Loading videos...</p>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
